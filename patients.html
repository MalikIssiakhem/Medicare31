<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Cabinet Médical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Barre latérale -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-hospital-alt"></i> Cabinet</h2>
        </div>
        <ul class="sidebar-menu">
            <li class="active"><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
            <li><a href="rendez-vous.html"><i class="fas fa-calendar-check"></i> Rendez-vous</a></li>
            <li><a href="patients.html"><i class="fas fa-users"></i> Patients</a></li>
            <li><a href="salles.html"><i class="fas fa-door-open"></i> Salles</a></li>
            <li><a href="facturation.html"><i class="fas fa-file-invoice-dollar"></i> Facturation</a></li>
            <li><a href="profile.html"><i class="fas fa-user-cog"></i> Profil</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
    </div>
        <!-- ... -->
    </div>

    <div class="main-content">
        <header class="main-header">
            <h1>Dossiers Patients</h1>
            <div class="search-bar">
                <input type="text" id="searchPatient" placeholder="Rechercher un patient...">
                <button id="newPatientBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau Patient</button>
            </div>
        </header>

        <table id="patientsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Date de naissance</th>
                    <th>Téléphone</th>
                    <th>Dernière visite</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rempli dynamiquement -->
            </tbody>
        </table>

        <!-- Modal pour ajouter/modifier un patient -->
        <div id="patientModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="patientModalTitle">Nouveau Patient</h2>
                <form id="patientForm">
                    <div class="form-group">
                        <label for="lastName">Nom</label>
                        <input type="text" id="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="firstName">Prénom</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="birthDate">Date de naissance</label>
                        <input type="date" id="birthDate" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Genre</label>
                        <select id="gender" required>
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                            <option value="O">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label for="address">Adresse</label>
                        <textarea id="address" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes médicales</label>
                        <textarea id="notes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>

        <!-- Modal pour afficher les détails d'un patient -->
        <div id="patientDetailsModal" class="modal">
            <div class="modal-content large-modal">
                <span class="close">&times;</span>
                <h2 id="patientDetailsTitle">Détails du Patient</h2>
                <div id="patientDetailsContent">
                    <!-- Rempli dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/patients.js"></script>
</body>
</html>
