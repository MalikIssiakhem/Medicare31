<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare31 – Nouveau mot de passe</title>
    <link rel="stylesheet" href="css/reset-password.css" />
  </head>
  <body>
    <main class="reset-layout">
      <section class="reset-panel">
        <div class="reset-brand">
          <div class="brand-icon">M</div>
          <div>
            <h1>MediCare31</h1>
            <p>Réinitialisation sécurisée de votre mot de passe</p>
          </div>
        </div>

        <div class="reset-card">
          <div class="reset-step">Étape 2 sur 2</div>
          <h2>Nouveau mot de passe</h2>
          <p>
            Saisissez un nouveau mot de passe pour reprendre le contrôle de
            votre compte.
          </p>

          <div class="alert" id="alertBox">
            <span id="alertText">Erreur lors de la validation.</span>
          </div>

          <form id="resetPasswordForm">
            <label for="password">Nouveau mot de passe</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="new-password"
            />

            <label for="confirmPassword">Confirmer le mot de passe</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="••••••••"
              autocomplete="new-password"
            />

            <button type="submit">Mettre à jour le mot de passe</button>
          </form>

          <div class="footer-note">
            <a href="login.html">Retour à la connexion</a>
          </div>
        </div>
      </section>
    </main>

    <script src="js/reset-password.js"></script>
  </body>
</html>
