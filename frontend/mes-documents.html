<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes documents — MediCare31</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/mes-documents.css" />
    <link rel="stylesheet" href="css/chatbot.css" />
  </head>
  <body>
    <nav>
      <a class="logo" href="index2.html">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L4 6v6c0 5.25 3.5 10.14 8 11.35C16.5 22.14 20 17.25 20 12V6l-8-4z" />
            <rect x="10" y="7" width="4" height="10" rx="1" />
            <rect x="7" y="10" width="10" height="4" rx="1" />
          </svg>
        </div>
        MediCare31
      </a>
      <div class="nav-right">
        <button class="notif-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="notif-dot"></span>
        </button>

        <div class="user-chip" id="userMenuBtn" onclick="toggleUserMenu(event)">
          <div class="avatar" id="user-nav-avatar">--</div>
          <span id="user-nav-name">Chargement…</span>
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></svg>
          <div class="user-dropdown" id="userDropdown" onclick="event.stopPropagation()">
            <div class="dropdown-item" onclick="confirmLogout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Se déconnecter
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="app">
      <aside>
        <ul class="side-nav">
          <li>
            <a href="index2.html">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>
              Tableau de bord
            </a>
          </li>
          <li>
            <a href="rendez-vous.html">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
              Mes rendez-vous
            </a>
          </li>
          <li class="active">
            <a href="mes-documents.html">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /></svg>
              Mes documents
            </a>
          </li>
          <li>
            <a href="messagerie.html">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
              Ma messagerie
            </a>
          </li>
        </ul>
      </aside>

      <main class="docs-main">
        <div class="docs-container">
          <div class="page-head">
            <h1>Mes documents</h1>
            <p class="page-sub">Retrouvez et téléchargez vos ordonnances, analyses et comptes-rendus.</p>
          </div>

          <div class="docs-toolbar">
            <div class="search-bar">
              <input type="text" id="docSearch" placeholder="Rechercher un document..." autocomplete="off" />
            </div>
            <div class="type-filters" id="typeFilters">
              <button class="chip active" data-type="">Tous</button>
              <button class="chip" data-type="carnet_sante">Carnet de santé</button>
              <button class="chip" data-type="ordonnance">Ordonnances</button>
              <button class="chip" data-type="analyse">Analyses</button>
              <button class="chip" data-type="compte_rendu">Comptes-rendus</button>
              <button class="chip" data-type="certificat">Certificats</button>
              <button class="chip" data-type="autre">Autres</button>
            </div>
          </div>

          <div id="docList" class="doc-list">
            <div class="doc-loading">Chargement de vos documents…</div>
          </div>
        </div>
      </main>
    </div>

    <div class="logout-overlay" id="logoutOverlay" onclick="closeLogoutModal()">
      <div class="logout-modal" onclick="event.stopPropagation()">
        <h3>Déconnexion</h3>
        <p>Voulez-vous vraiment vous déconnecter ?</p>
        <div class="logout-modal-actions">
          <button class="btn-cancel-logout" onclick="closeLogoutModal()">Annuler</button>
          <button class="btn-confirm-logout" onclick="logout()">Se déconnecter</button>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/chatbot.js"></script>
    <script src="/js/mes-documents.js"></script>
  </body>
</html>
