<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendez-vous | Cabinet Médical</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Barre latérale (identique à dashboard.html) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-hospital-alt"></i> Cabinet</h2>
        </div>
        <ul class="sidebar-menu">
            <li class="active"><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
            <li><a href="rendez-vous.html"><i class="fas fa-calendar-check"></i> Rendez-vous</a></li>
            <li><a href="patients.html"><i class="fas fa-users"></i> Patients</a></li>
            <li><a href="salles.html"><i class="fas fa-door-open"></i> Salles</a></li>
            <li><a href="facturation.html"><i class="fas fa-file-invoice-dollar"></i> Facturation</a></li>
            <li><a href="profile.html"><i class="fas fa-user-cog"></i> Profil</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
    </div>
        <!-- ... -->
    </div>

    <div class="main-content">
        <header class="main-header">
            <h1>Gestion des Rendez-vous</h1>
            <button id="newAppointmentBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Nouveau RDV</button>
        </header>

        <div class="appointment-container">
            <div id="calendar"></div>
        </div>

        <!-- Modal pour ajouter/modifier un RDV -->
        <div id="appointmentModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Nouveau Rendez-vous</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="patient">Patient</label>
                        <select id="patient" required>
                            <option value="">Sélectionnez un patient</option>
                            <!-- Rempli dynamiquement -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="practitioner">Praticien</label>
                        <select id="practitioner" required>
                            <option value="">Sélectionnez un praticien</option>
                            <!-- Rempli dynamiquement -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="room">Salle</label>
                        <select id="room" required>
                            <option value="">Sélectionnez une salle</option>
                            <!-- Rempli dynamiquement -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Heure</label>
                        <input type="time" id="time" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Durée (min)</label>
                        <input type="number" id="duration" min="15" max="120" value="30" required>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.js"></script>
    <script src="js/rendez-vous.js"></script>
</body>
</html>
